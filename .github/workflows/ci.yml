name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile (syntax check)
        run: python -m py_compile 8vert-enhanced.py

      - name: Install tkinter (for headless import test)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Import check (no GUI launched)
        run: |
          python - <<'PY'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location("verh", "8vert-enhanced.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert hasattr(mod, "App"), "App class missing"
          print("import OK, App present")
          PY

      - name: Verify calculator sandbox has no builtin escape
        run: |
          python - <<'PY'
          import re, math
          # Mirror the sanitiser used in the app.
          def sanitize(expr):
              expr = re.sub(r"sqrt", "math.sqrt", expr)
              expr = re.sub(r"\bpi\b", str(math.pi), expr)
              return re.sub(r"[^0-9+\-*/.()% ]", "", expr)

          for bad in ["__import__('os').system('ls')", "().__class__", "open('x')"]:
              cleaned = sanitize(bad)
              assert not re.search(r"[A-Za-z_]", cleaned), f"letters survived: {cleaned!r}"
          assert sanitize("2+2*3") == "2+2*3"
          assert eval(sanitize("2+2*3"), {"__builtins__": {}}, {"math": math}) == 8
          print("sandbox checks passed")
          PY
